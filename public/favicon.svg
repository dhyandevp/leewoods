<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a20" />
      <stop offset="100%" stop-color="#041610" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B6A" />
      <stop offset="100%" stop-color="#B37C4D" />
    </linearGradient>
  </defs>
  <!-- Background Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#C28B5B" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Monogram L (Ivory) -->
  <path
    d="M 15 19
       C 15 17.89 15.89 17 17 17
       L 19.5 17
       C 20.61 17 21.5 17.89 21.5 19
       L 21.5 41
       L 29.5 41
       C 30.61 41 31.5 41.89 31.5 43
       L 31.5 44.5
       C 31.5 45.61 30.61 46.5 29.5 46.5
       L 17 46.5
       C 15.89 46.5 15 45.61 15 44.5
       Z"
    fill="#F3F0E8"
  />

  <!-- Monogram W (Warm Bronze) -->
  <path
    d="M 28.5 21
       L 33.8 44
       C 34.1 45.3 35.6 45.8 36.6 45
       L 40 42.2
       L 43.4 45
       C 44.4 45.8 45.9 45.3 46.2 44
       L 51.5 21"
    fill="none"
    stroke="url(#bronzeGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Architectural Alignment Dot -->
  <circle cx="40" cy="22" r="2" fill="#D49B6A" />
</svg>
